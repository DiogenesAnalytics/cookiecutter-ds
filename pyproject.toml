[project]
name = "cookiecutter-ds"
version = "0.1.0"
description = "Cookiecutter template for data science projects"
authors = [
    { name = "Diogenes Analytics" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.13"
homepage = "https://github.com/DiogenesAnalytics/cookiecutter-ds"
repository = "https://github.com/DiogenesAnalytics/cookiecutter-ds"

[project.urls]
Changelog = "https://github.com/DiogenesAnalytics/cookiecutter-ds/releases"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
cookiecutter = ">=2.6.0"
pytest = ">=8.0"
pytest-cookies = ">=0.7.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
black = ">=25.0"
deptry = "^0.23.0"
flake8 = ">=7.0"
isort = ">=6.0"
mypy = ">=1.0"

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
